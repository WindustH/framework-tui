[global]
keymap = [
  { on = ":", run = "command", desc = "Enter command" },
  { on = "q", run = "quit", desc = "Quit music-tui" },
  { on = "ctrl-c", run = "quit", desc = "Quit music-tui" },
  { on = "a", run = "tab_previous", desc = "Switch to previous tab" },
  { on = "f", run = "tab_next", desc = "Switch to next tab" },
  { on = "h", run = "tab_previous", desc = "Switch to previous tab" },
  { on = "l", run = "tab_next", desc = "Switch to next tab" },
  { on = "left", run = "tab_previous", desc = "Switch to previous tab" },
  { on = "right", run = "tab_next", desc = "Switch to next tab" },
  { on = "tab", run = "tab_next", desc = "Switch to next tab" },
  { on = "backtab", run = "tab_previous", desc = "Switch to previous tab" },
  { on = "[", run = "previous", desc = "Previous song" },
  { on = "]", run = "next", desc = "Next song" },
  { on = "\\", run = "play_pause", desc = "Toggle play or pause" },
  { on = "x", run = "stop", desc = "Stop playback" },
  { on = "-", run = "seek_back", desc = "Seek 5 seconds back" },
  { on = "=", run = "seek_forward", desc = "Seek 5 seconds forward" },
  { on = "_", run = "seek_back_long", desc = "Seek 30 seconds back" },
  { on = "+", run = "seek_forward_long", desc = "Seek 30 seconds forward" },
  { on = "{", run = "volume_down", desc = "Decrease volume" },
  { on = "}", run = "volume_up", desc = "Increase volume" },
  { on = "m", run = "volume_mute", desc = "Toggle mute" },
  { on = [",", "r"], run = "toggle_repeat", desc = "Toggle repeat" },
  { on = [",", "t"], run = "toggle_random", desc = "Toggle random" },
  { on = [",", "y"], run = "cycle_single", desc = "Cycle single mode" },
  { on = [",", "c"], run = "toggle_consume", desc = "Toggle consume" },
]

