[queue]
keymap = [
  { on = "esc", run = "back", desc = "Clear filter or return to first tab" },
  { on = "f1", run = "help", desc = "Show queue key bindings" },
  { on = "j", run = "queue_down", desc = "Move selection down" },
  { on = "down", run = "queue_down", desc = "Move selection down" },
  { on = "k", run = "queue_up", desc = "Move selection up" },
  { on = "up", run = "queue_up", desc = "Move selection up" },
  { on = "pgdn", run = "queue_page_down", desc = "Move selection one page down" },
  { on = "pagedown", run = "queue_page_down", desc = "Move selection one page down" },
  { on = "pgup", run = "queue_page_up", desc = "Move selection one page up" },
  { on = "pageup", run = "queue_page_up", desc = "Move selection one page up" },
  { on = ["g", "c"], run = "queue_goto_playing", desc = "Jump to the currently playing song" },
  { on = ["g", "g"], run = "queue_top", desc = "Move selection to top" },
  { on = "home", run = "queue_top", desc = "Move selection to top" },
  { on = "G", run = "queue_end", desc = "Move selection to end" },
  { on = "end", run = "queue_end", desc = "Move selection to end" },
  { on = "enter", run = "queue_play", desc = "Play selected song" },
  { on = "d", run = "queue_delete", desc = "Remove selected song from queue" },
  { on = "D", run = "queue_clear", desc = "Clear the queue" },
  { on = "?", run = "queue_shuffle", desc = "Shuffle the queue" },
  { on = [",", "d"], run = "queue_dedup", desc = "Toggle hiding duplicate queue entries" },
  { on = "i", run = "queue_detail", desc = "Open details of the selected song" },
  { on = "e", run = "edit_metadata", desc = "Edit the selected song's metadata" },
  { on = "/", run = "queue_filter", desc = "Filter the queue (esc clears)" },
]

[library]
keymap = [
  { on = "esc", run = "back", desc = "Clear filter or return to first tab" },
  { on = "f1", run = "help", desc = "Show library key bindings" },
  { on = "j", run = "library_down", desc = "Move selection down" },
  { on = "down", run = "library_down", desc = "Move selection down" },
  { on = "k", run = "library_up", desc = "Move selection up" },
  { on = "up", run = "library_up", desc = "Move selection up" },
  { on = "pgdn", run = "library_page_down", desc = "Move selection one page down" },
  { on = "pagedown", run = "library_page_down", desc = "Move selection one page down" },
  { on = "pgup", run = "library_page_up", desc = "Move selection one page up" },
  { on = "pageup", run = "library_page_up", desc = "Move selection one page up" },
  { on = ["g", "g"], run = "library_top", desc = "Move selection to top" },
  { on = "home", run = "library_top", desc = "Move selection to top" },
  { on = "G", run = "library_end", desc = "Move selection to end" },
  { on = "end", run = "library_end", desc = "Move selection to end" },
  { on = "enter", run = "library_play", desc = "Play selected track (replaces play position)" },
  { on = "a", run = "library_append", desc = "Append selected track to the queue" },
  { on = "i", run = "library_detail", desc = "Open details of the selected track" },
  { on = "u", run = "library_rescan", desc = "Rescan the library database" },
  { on = "/", run = "library_filter", desc = "Filter the library (esc clears)" },
]

