[input]
keymap = [
  { on = "esc", run = "cancel", desc = "Cancel input" },
  { on = "f1", run = "help", desc = "Show input key bindings" },
  { on = "enter", run = "submit", desc = "Submit input" },
  { on = "backspace", run = "backspace", desc = "Delete before cursor" },
  { on = "delete", run = "delete", desc = "Delete under cursor" },
  { on = "left", run = "move_left", desc = "Move cursor left" },
  { on = "right", run = "move_right", desc = "Move cursor right" },
  { on = "home", run = "move_start", desc = "Move cursor to start" },
  { on = "ctrl-a", run = "move_start", desc = "Move cursor to start" },
  { on = "end", run = "move_end", desc = "Move cursor to end" },
  { on = "ctrl-e", run = "move_end", desc = "Move cursor to end" },
  { on = "ctrl-u", run = "kill_before_cursor", desc = "Delete before cursor" },
  { on = "ctrl-k", run = "kill_after_cursor", desc = "Delete after cursor" },
  { on = "tab", run = "completion_next", desc = "Select next completion" },
  { on = "backtab", run = "completion_previous", desc = "Select previous completion" },
  { on = "up", run = "history_previous", desc = "Previous command history" },
  { on = "down", run = "history_next", desc = "Next command history" },
]

[global]
keymap = [
  { on = ":", run = "command", desc = "Enter command" },
]

